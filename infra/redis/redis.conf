# Ojà Live — Redis configuration for local development.
#
# These settings mirror what we run in production, because the bid engine's
# correctness depends on them. See docs/MILESTONE-1-DESIGN.md §4.3 and §8.1.

# --- Durability ------------------------------------------------------------
# AOF is on. Every accepted bid is appended to a stream, and we must not lose
# the last second of them to a crash any more than we have to.
appendonly yes
appendfsync everysec
appendfilename "ojalive.aof"
dir /data

# RDB snapshots as a second line of defence.
save 900 1
save 300 10
save 60 10000

# --- Eviction --------------------------------------------------------------
# BullMQ requires noeviction. With any eviction policy, Redis may drop queue
# keys under memory pressure and jobs silently vanish — including the delayed
# jobs that close lots. This is the single most important line in this file.
maxmemory-policy noeviction

# --- Keyspace notifications ------------------------------------------------
# Kx = expired events, needed for presence and lock expiry observability.
notify-keyspace-events Kx

# --- Safety ----------------------------------------------------------------
# Lua scripts must not be able to run forever and block the single thread that
# serialises every bid on every lot.
busy-reply-threshold 5000

# Make accidental data loss in development harder.
rename-command FLUSHALL ""

# --- Logging ---------------------------------------------------------------
loglevel notice

# --- Clients ---------------------------------------------------------------
# We target 10,000 concurrent sockets in the load tests; the API multiplexes
# them, but the pub/sub adapter and BullMQ open their own connections.
maxclients 10000
timeout 0
tcp-keepalive 300
