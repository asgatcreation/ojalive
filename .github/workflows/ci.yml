name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26.13.0'
  PNPM_VERSION: '12.10.1'

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  integration:
    name: Integration tests (real Postgres, Redis and Lua)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compose rather than service containers, deliberately: the bid engine
      # depends on Redis settings (noeviction, appendfsync everysec) that live in
      # infra/redis/redis.conf, and a service container cannot mount a config
      # file. This way CI runs against the same configuration a developer does.
      - name: Start Postgres and Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait

      - name: Apply migrations
        run: pnpm --filter @ojalive/db db:migrate
        env:
          DATABASE_URL: postgresql://ojalive:ojalive@localhost:55436/ojalive

      - name: Integration tests
        run: pnpm run test:int
        env:
          TEST_DATABASE_URL: postgresql://ojalive:ojalive@localhost:55436/ojalive
          TEST_REDIS_URL: redis://localhost:56386

      - name: Container logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail=200

      - name: Stop containers
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (fails on high or critical)
        run: pnpm audit --audit-level high
